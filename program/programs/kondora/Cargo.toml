[package]
name = "kondora"
version = "0.1.0"
description = "Kondora: leveraged AI-run prediction markets"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "kondora"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.2" }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor"] }
session-keys = { version = "=3.1.1", features = ["no-entrypoint"] }
libm = "0.2"
