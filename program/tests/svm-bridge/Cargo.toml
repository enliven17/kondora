# LiteSVM over JSON lines on stdin/stdout, so TS tests can drive the built
# program on Windows (no solana-test-validator, no litesvm npm binary).
[package]
name = "svm-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
litesvm = "0.16.0"
solana-account = "4.3.0"
solana-address = "~2.6.1"
solana-clock = "~3.1.1"
solana-transaction = { version = "4.1.5", features = ["serde"] }
bincode = "1.3.3"
base64 = "0.22.1"
serde_json = "1"
